<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMI - Interactive Musical Instruments</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <!-- Landing Page Overlay -->
    <div id="landingPage" class="landing-page">
        <div class="landing-content">
            <div class="landing-logo">
                <img src="./assets/LandingLogo.png" alt="IMI Logo">
            </div>
            <input
                type="password"
                id="passwordInput"
                class="password-input"
                placeholder="(password: 1234)"
                autocomplete="off"
            >
            <button id="watchDemoButton" class="watch-demo-button">
                Watch Demo Video
            </button>
        </div>
    </div>

    <!-- YouTube Video Background -->
    <div class="video-container">
        <iframe
            id="mainVideo"
            src="https://www.youtube.com/embed/5cP7HtnagEk?autoplay=0&mute=1&controls=0&loop=1&playlist=5cP7HtnagEk&modestbranding=1&rel=0&showinfo=0&fs=0&iv_load_policy=3&disablekb=1&playsinline=1&enablejsapi=1"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
        <div class="video-overlay"></div>
    </div>

    <!-- Logo -->
    <div class="logo">
        <img src="./assets/LandingLogo.png" alt="IMI Logo">
    </div>

    <!-- Mute Button -->
    <button id="muteButton" class="mute-button" aria-label="Toggle Mute">
        <svg id="muteIcon" class="mute-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <svg id="unmuteIcon" class="unmute-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
    </button>

    <!-- Floating Instrument Navigation -->
    <nav id="instrumentNav" class="instrument-nav">
        <!-- Instrument buttons will be dynamically generated here -->
    </nav>

    <!-- Main Content Area -->
    <main class="content">
        <div id="info" class="info-panel">
            <button id="closeInfoButton" class="close-info-button" aria-label="Close Info Panel">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <div class="instrument-image">
                <img id="instrumentImg" src="" alt="Instrument">
            </div>
            <div class="instrument-details">
                <h2 id="instrumentName">Instrument Name</h2>
                <p id="instrumentDescription">Instrument description goes here.</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Modules -->
    <script type="module" src="./src/main.js"></script>
</body>
</html>
